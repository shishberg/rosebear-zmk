# Uncomment the following lines to enable the Microdox RGB Underglow
# CONFIG_ZMK_RGB_UNDERGLOW=y
# CONFIG_WS2812_STRIP=y

# Uncomment the following line to enable the Microdox OLED Display
# CONFIG_ZMK_DISPLAY=y

# Supposed to make connection more stable for iOS
CONFIG_ZMK_HID_CONSUMER_REPORT_USAGES_BASIC=y

# Enable deep sleep
CONFIG_ZMK_SLEEP=y

# Some nice!nano clones have a missing/defective 32.768kHz crystal; use the
# internal RC oscillator for the low-frequency clock so boot doesn't hang
# waiting for a crystal that never starts. Safe on genuine boards too.
CONFIG_CLOCK_CONTROL_NRF_K32SRC_RC=y
CONFIG_CLOCK_CONTROL_NRF_K32SRC_500PPM=y
